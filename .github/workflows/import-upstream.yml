name: Import upstream OpenWA snapshot

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/import-upstream.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Copy audited upstream snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEST_REPO: ${{ github.repository }}
          UPSTREAM_REPO: rmyndharis/OpenWA
          EXPECTED_UPSTREAM_SHA: 49d7d70b0bf43c0cabbe560aeb33b4246eca3eca
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 --branch main "https://github.com/${UPSTREAM_REPO}.git" /tmp/openwa-upstream
          upstream_sha="$(git -C /tmp/openwa-upstream rev-parse HEAD)"

          if [ "${upstream_sha}" != "${EXPECTED_UPSTREAM_SHA}" ]; then
            echo "::error::Upstream main moved: expected ${EXPECTED_UPSTREAM_SHA}, got ${upstream_sha}"
            exit 1
          fi

          git clone "https://x-access-token:${GH_TOKEN}@github.com/${DEST_REPO}.git" /tmp/faya-openwa
          cd /tmp/faya-openwa

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Copy the complete audited working tree while preserving this temporary
          # importer. Workflow files are installed separately via the GitHub
          # connector because GITHUB_TOKEN cannot author workflow-file changes.
          rsync -a --delete             --exclude ".git/"             --exclude ".github/workflows/"             /tmp/openwa-upstream/ ./

          git add -A
          if git diff --cached --quiet; then
            echo "No snapshot changes to import."
            exit 0
          fi

          git commit -m "chore: import OpenWA snapshot ${upstream_sha}"
          git push origin HEAD:main

          echo "Imported OpenWA snapshot ${upstream_sha}"
